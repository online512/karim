<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Inter',sans-serif;
background:#030814;
overflow:hidden;
height:100vh;
color:white;
}

.bg{
position:fixed;
inset:0;
background:
radial-gradient(circle at 20% 20%, rgba(0,195,255,.18), transparent 40%),
radial-gradient(circle at 80% 30%, rgba(0,120,255,.15), transparent 40%),
radial-gradient(circle at 50% 90%, rgba(255,255,255,.05), transparent 50%),
#030814;
z-index:-2;
}

.grid{
position:fixed;
inset:0;
background-image:
linear-gradient(rgba(79,209,255,.04) 1px, transparent 1px),
linear-gradient(90deg, rgba(79,209,255,.04) 1px, transparent 1px);
background-size:30px 30px;
animation:gridMove 15s linear infinite;
z-index:-1;
}

@keyframes gridMove{
0%{transform:translateY(0);}
100%{transform:translateY(30px);}
}

.container{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:16px;
}

.card{
width:100%;
max-width:420px;
background:rgba(255,255,255,.05);
backdrop-filter:blur(30px);
border:1px solid rgba(79,209,255,.18);
border-radius:30px;
padding:20px;
box-shadow:0 0 60px rgba(79,209,255,.15);
position:relative;
overflow:hidden;
}

.card::before{
content:'';
position:absolute;
top:-120px;
left:-120px;
width:240px;
height:240px;
background:radial-gradient(circle,rgba(79,209,255,.30),transparent);
animation:rotateGlow 12s linear infinite;
}

@keyframes rotateGlow{
100%{transform:rotate(360deg);}
}

.logo-wrap{
display:flex;
justify-content:center;
margin-bottom:12px;

.logo{

}

@keyframes pulse{
0%{
box-shadow:0 0 0 rgba(79,209,255,.3);
}
50%{
box-shadow:0 0 35px rgba(79,209,255,.9);
}
100%{
box-shadow:0 0 0 rgba(79,209,255,.3);
}
}

.badge{

.live-box{

}

.live{
flex:1;
background:rgba(255,255,255,.03);
border:1px solid rgba(79,209,255,.12);
padding:10px;
border-radius:16px;
text-align:center;
}

.live h3{
font-size:18px;
color:#4FD1FF;
margin-bottom:3px;
}

.live p{
font-size:10px;
opacity:.75;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-bottom:18px;
}

.stat{
background:rgba(255,255,255,.03);
border:1px solid rgba(79,209,255,.10);
padding:12px 8px;
border-radius:16px;
text-align:center;
}

.stat strong{
display:block;
font-size:18px;
color:#4FD1FF;
}

.stat span{

.activity{
background:rgba(255,255,255,.03);
border:1px solid rgba(79,209,255,.10);
padding:14px;
border-radius:18px;
margin-bottom:18px;
}

.activity-title{
font-size:12px;
margin-bottom:12px;
}

.equalizer{
display:flex;
justify-content:space-between;
align-items:flex-end;
height:55px;
}

.bar{
width:12px;
border-radius:20px;
background:linear-gradient(to top,#00AFFF,#B8F4FF);
animation:wave 1.4s infinite ease-in-out;
}

.bar:nth-child(2){animation-delay:.2s;}
.bar:nth-child(3){animation-delay:.4s;}
.bar:nth-child(4){animation-delay:.6s;}
.bar:nth-child(5){animation-delay:.8s;}
.bar:nth-child(6){animation-delay:1s;}

@keyframes wave{
0%,100%{height:15px;}
50%{height:55px;}
}

.cta{
display:block;
width:100%;
text-align:center;
padding:18px;
border-radius:18px;
text-decoration:none;
font-weight:800;
font-size:15px;
background:linear-gradient(135deg,#00D9FF,#007BFF);
color:white;
box-shadow:0 0 35px rgba(0,180,255,.45);
transition:.3s;
margin-bottom:12px;
}

.cta:hover{
transform:translateY(-3px) scale(1.02);
}

.cta span{
display:block;
font-size:11px;
font-weight:600;
margin-top:4px;
opacity:.95;
}

.footer{

font-size:10px;

.live-indicator{
position:absolute;
top:16px;
right:16px;
display:flex;
align-items:center;
gap:6px;
font-size:11px;
font-weight:700;
color:#71FF9B;
}

.live-dot{
width:8px;
height:8px;
border-radius:50%;
background:#71FF9B;
animation:blink 1s infinite;
}

@keyframes blink{
50%{opacity:.25;}
}
